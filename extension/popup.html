<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>CiteMD</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>CiteMD</h1>
      <label for="apiUrl">Local API</label>
      <input id="apiUrl" type="url" value="http://localhost:8001">
      <button id="save">Save</button>
      <p id="status"></p>
      <p>Open PubMed and click the CiteMD button in the lower-right corner.</p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
